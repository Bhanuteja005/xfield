name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:local
      - name: Test real local API and contracts
        run: |
          npm run backend > /tmp/xfield-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/api/session && break
            sleep 1
          done
          npm run test
